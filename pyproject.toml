[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "queuefy"
version = "1.0.1"
description = "Queuefy — asynchronous task queue and scheduler for Python, where one task runs on exactly one worker."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Paulo Coutinho" }]
keywords = ["queue", "task-queue", "job-queue", "scheduler", "cron", "worker", "background-jobs", "asyncio", "distributed", "postgresql", "mysql", "sqlite", "redis", "sqlalchemy", "fastapi", "django", "tasks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0"]
redis = ["redis>=5.0"]

[project.urls]
Homepage = "https://github.com/paulocoutinhox/queuefy"
Documentation = "https://github.com/paulocoutinhox/queuefy/tree/main/docs"
Issues = "https://github.com/paulocoutinhox/queuefy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/queuefy"]

[tool.black]
line-length = 320
target-version = ["py311"]
skip-magic-trailing-comma = true

[tool.ruff]
line-length = 320

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

markers = ["stress: many separate processes against a real server, which is minutes and not seconds — run by `make stress`"]

# the stress suite is left out of every ordinary run, because a suite nobody waits for is a suite nobody runs
addopts = ["-m", "not stress"]

# no test runs forever: a hang becomes a failure with a traceback instead of a runner burning for hours
timeout = 120

# the thread method kills the process and dumps every stack, which is the one that works when the block is somewhere a signal never reaches
timeout_method = "thread"

[tool.coverage.run]
branch = true
source = ["queuefy"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
fail_under = 100
# the one exemption, because an abstract method has no body to run. a gate with an escape hatch nobody needs is one somebody reaches for instead of writing the test
exclude_lines = ["@abstractmethod"]
